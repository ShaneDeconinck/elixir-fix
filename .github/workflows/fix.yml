# Beveiligingsupdates uitvoeren in de repo die ze aangaan.
#
# Elixir meet de kwetsbaarheden en beslist welk pakket naar welke versie mag. Dat oordeel
# blijft daar. Dit is de andere helft: de handen, en die horen niet op de machine te draaien
# waar de sleutels van de hele vloot staan. Eén postinstall-script in één afhankelijkheid
# van één project leest ze anders allemaal.
#
# Hier bestaat die map niet. De runner wordt na afloop weggegooid, en de enige sleutel is de
# token die GitHub voor deze ene run uitdeelt.
#
# Aansluiten: zie de README.
name: Elixir fix

on:
  workflow_call:
    inputs:
      plan:
        description: 'JSON: [{"pkg":"tar","to":"7.5.21","lock":"package-lock.json"}]'
        required: true
        type: string
      node-version:
        description: 'De node-versie waarop dit project bouwt, of leeg voor een project zonder node'
        required: false
        default: '24'
        type: string
      php-version:
        description: 'De php-versie, of leeg voor een project zonder php'
        required: false
        default: ''
        type: string
      install:
        description: 'Hoe dit project zijn pakketten installeert'
        required: false
        default: 'npm install --no-audit --no-fund'
        type: string
      prepare:
        description: |
          Wat er na het installeren moet gebeuren voor de tests kunnen draaien. Een
          Laravel-project heeft bijvoorbeeld een omgevingsbestand en een sleutel nodig;
          zonder die stappen staan de tests rood om een reden die niets met de update te
          maken heeft, en weigert de nulmeting terecht.
        required: false
        default: ''
        type: string
      test:
        description: 'Het commando dat de rechter is'
        required: false
        default: 'npm test'
        type: string
      build:
        description: 'De build, of leeg als dit project er geen heeft'
        required: false
        default: 'npm run build'
        type: string
      env:
        description: |
          Regels KEY=value die de build nodig heeft. Publieke configuratie, geen geheimen:
          wat hier staat komt uit het workflow-bestand van het project en is dus voor
          iedereen leesbaar. Een echte sleutel hoort in de secrets van de repo, en die
          heeft deze workflow niet nodig.
        required: false
        default: ''
        type: string
      mysql:
        description: |
          De naam van de databank die de tests nodig hebben, of leeg voor een project dat
          zonder kan. Twee Laravel-projecten in deze vloot testen tegen een echte MySQL en
          niet tegen sqlite, omdat die twee het oneens zijn op precies de plekken die pas in
          productie opvallen: sqlite bewaart wat je erin duwt, MySQL heeft kolomtypes en
          zegt nee.

          Een aangeroepen workflow kan geen `services:` van de aanroeper krijgen, dus start
          hij de databank zelf.
        required: false
        default: ''
        type: string
      schema:
        description: 'Pad naar een sql-bestand dat na het starten ingelezen wordt, of leeg'
        required: false
        default: ''
        type: string
    outputs:
      uitslag:
        description: 'Wat er gebeurde, als json'
        value: ${{ jobs.fix.outputs.uitslag }}
      branch:
        description: 'De tak met het werk, of leeg als er niets veranderde'
        value: ${{ jobs.fix.outputs.branch }}

jobs:
  fix:
    runs-on: ubuntu-latest
    # Alleen schrijven naar de repo. Voorstellen doet Elixir, met zijn eigen sleutel: een
    # pull request van de GITHUB_TOKEN zet geen checks in gang, en dan staat er een voorstel
    # zonder oordeel. Bovendien is "mag pull requests maken" bij GitHub dezelfde schakelaar
    # als "mag ze goedkeuren", en dat is breder dan dit werk vraagt.
    permissions:
      contents: write
    outputs:
      uitslag: ${{ steps.fix.outputs.uitslag }}
      branch: ${{ steps.tak.outputs.branch }}
    steps:
      - uses: actions/checkout@v4

      # De handen komen uit deze repo, zodat een verbetering eraan alle projecten bereikt
      # zonder dat er ergens een kopie ligt te verouderen.
      - uses: actions/checkout@v4
        with:
          repository: ShaneDeconinck/elixir-fix
          ref: v1
          path: .elixir-fix

      - uses: actions/setup-node@v4
        if: inputs.node-version != ''
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      # Alleen waar het nodig is. Een Laravel-project heeft php nodig en vaak ook node; een
      # Astro-site heeft aan php niets, en een runner die het toch installeert is een minuut
      # per run die niemand terugkrijgt.
      - uses: shivammathur/setup-php@v2
        if: inputs.php-version != ''
        with:
          php-version: ${{ inputs.php-version }}
          tools: composer

      # Wat de build nodig heeft. Via een variabele en niet rechtstreeks in de regel: zo
      # blijft de inhoud data en wordt ze nooit shell.
      - name: Omgeving zetten
        if: inputs.env != ''
        env:
          OMGEVING: ${{ inputs.env }}
        run: printf '%s\n' "$OMGEVING" >> "$GITHUB_ENV"

      - run: ${{ inputs.install }}

      # De databank, als de tests er een nodig hebben. In docker en niet als service, want
      # een aangeroepen workflow kan geen `services:` van de aanroeper overnemen.
      - name: Databank starten
        if: inputs.mysql != ''
        env:
          DB: ${{ inputs.mysql }}
          SCHEMA: ${{ inputs.schema }}
        run: |
          set -euo pipefail
          docker run -d --name elixir-mysql \
            -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE="$DB" \
            -p 3306:3306 mysql:8 >/dev/null
          # Wachten tot ze antwoordt: een testrun die op een halfwakkere databank botst,
          # faalt om een reden die niets met de update te maken heeft.
          for i in $(seq 1 60); do
            docker exec elixir-mysql mysqladmin ping -proot --silent >/dev/null 2>&1 && break
            sleep 2
          done
          if [ -n "$SCHEMA" ] && [ -f "$SCHEMA" ]; then
            docker exec -i elixir-mysql mysql -uroot -proot "$DB" < "$SCHEMA"
          fi

      - name: Klaarzetten
        if: inputs.prepare != ''
        run: ${{ inputs.prepare }}

      # De nulmeting. Staan de tests al rood vóór de wijziging, dan is er geen rechter
      # beschikbaar en gebeurt er niets: anders veroordeelt de update een fout die er al was.
      - name: Tests vooraf
        run: ${{ inputs.test }}

      - name: Pakketten bijwerken
        id: fix
        env:
          PLAN: ${{ inputs.plan }}
        run: node .elixir-fix/scripts/elixir-fix.mjs

      - name: Tests achteraf
        run: ${{ inputs.test }}

      # Bouwen, want een versiesprong breekt zelden een unit test en vaak een import.
      - name: Bouwen
        if: inputs.build != ''
        run: ${{ inputs.build }}

      - name: Tak omhoog duwen
        id: tak
        env:
          UITSLAG: ${{ steps.fix.outputs.uitslag }}
        run: |
          set -euo pipefail
          # Sterretjes en niet **/: een pathspec met ** faalt als hij niets vindt, terwijl
          # *package.json op elke diepte matcht en zwijgt als er niets is.
          if git diff --quiet -- '*package.json' '*package-lock.json' '*composer.json' '*composer.lock'; then
            echo "de commando's veranderden niets aan de lockfiles, dus er is niets voor te stellen"
            exit 0
          fi
          BRANCH="elixir/security-$(date +%Y-%m-%d-%H%M)"
          git config user.name "elixir"
          git config user.email "elixir@abovebeyond.ai"
          git checkout -b "$BRANCH"
          git diff --name-only -z -- '*package.json' '*package-lock.json' '*composer.json' '*composer.lock' \
            | xargs -0 -r git add --
          git commit -m "Beveiligingsupdates" -m "$UITSLAG"
          git push -u origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      # Wat Elixir moet weten om het voorstel te openen en later te kunnen oordelen: wat er
      # gebeurde, en op welke tak het staat. Als artifact en niet als log, want een log is
      # voor mensen en verandert zodra iemand een regel mooier maakt.
      - name: Uitslag bewaren
        if: always()
        env:
          UITSLAG: ${{ steps.fix.outputs.uitslag }}
          BRANCH: ${{ steps.tak.outputs.branch }}
        run: |
          node -e 'const u=JSON.parse(process.env.UITSLAG||"{}"); u.branch=process.env.BRANCH||null; require("fs").writeFileSync("uitslag.json", JSON.stringify(u, null, 2))'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elixir-fix
          path: uitslag.json
